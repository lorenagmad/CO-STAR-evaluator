<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evaluador de prompts CO-STAR</title>
<meta name="description" content="Herramienta docente para evaluar la completitud de prompts con la estructura CO-STAR.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231e293b'/%3E%3Cpath d='M16 6l2.6 6.3 6.8.5-5.2 4.4 1.6 6.6L16 20.3l-5.8 3.5 1.6-6.6-5.2-4.4 6.8-.5z' fill='%23fbbf24'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0;
    --accent:#1e293b; --ok:#16a34a; --warn:#d97706; --bad:#dc2626; --good:#2563eb;
    --radius:12px; --shadow:0 1px 2px rgba(15,23,42,.06),0 4px 16px rgba(15,23,42,.05);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;font-size:15px}
  button{font:inherit;cursor:pointer}
  .hidden{display:none!important}

  header.top{position:sticky;top:0;z-index:20;background:var(--accent);color:#fff}
  header.top .wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:12px 20px;max-width:1280px;margin:0 auto}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;letter-spacing:.2px}
  .brand .logo{display:flex;gap:2px}
  .brand .logo span{width:20px;height:22px;border-radius:4px;display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff}
  .student-chip{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13.5px;opacity:.95}
  .student-chip b{font-weight:600}
  .btn{border:1px solid transparent;border-radius:8px;padding:9px 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:7px;transition:.15s}
  .btn-primary{background:#2563eb;color:#fff}
  .btn-primary:hover{background:#1d4ed8}
  .btn-primary:disabled{background:#94a3b8;cursor:not-allowed}
  .btn-light{background:#fff;color:var(--ink);border-color:var(--line)}
  .btn-light:hover{background:#f1f5f9}
  .btn-ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}
  .btn-ghost:hover{background:rgba(255,255,255,.1)}
  .btn-report{background:#fbbf24;color:#1e293b}
  .btn-report:hover{background:#f59e0b}
  .btn-sm{padding:5px 10px;font-size:12.5px}

  main{max-width:1280px;margin:0 auto;padding:22px 20px 60px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
  h1,h2,h3{margin:0;line-height:1.25}
  h2{font-size:18px}
  .muted{color:var(--muted)}
  .small{font-size:13px}

  /* Identificación */
  #ident{max-width:560px;margin:30px auto}
  #ident h1{font-size:24px;margin-bottom:6px}
  .field{display:flex;flex-direction:column;gap:5px;margin-top:14px}
  .field label{font-weight:600;font-size:13.5px}
  .field input{padding:10px 12px;border:1px solid #cbd5e1;border-radius:8px;font:inherit}
  .field input:focus,textarea:focus{outline:2px solid #93c5fd;border-color:#3b82f6}
  .field .err{color:var(--bad);font-size:12.5px;min-height:1em}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .notice{background:#f1f5f9;border-radius:8px;padding:10px 12px;font-size:13px;margin-top:16px;color:#334155}

  /* Guía */
  details.guide{margin-bottom:18px}
  details.guide summary{cursor:pointer;font-weight:700;font-size:15px;list-style:none;display:flex;align-items:center;gap:8px}
  details.guide summary::before{content:"▸";transition:.15s}
  details.guide[open] summary::before{transform:rotate(90deg)}
  .guide-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-top:14px}
  .guide-item{border-left:4px solid;padding:8px 12px;background:#fafafa;border-radius:6px;font-size:13.5px}
  .guide-item b{display:block;margin-bottom:3px}

  /* Layout de trabajo */
  .grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:20px;align-items:start}
  @media (max-width:980px){.grid{grid-template-columns:1fr}.row2{grid-template-columns:1fr}}
  .editor-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  textarea#prompt{width:100%;min-height:520px;resize:vertical;padding:14px;border:1px solid #cbd5e1;border-radius:10px;font:14px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:#fcfcfd}
  .editor-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;flex-wrap:wrap}
  .detected{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
  .pill{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:#94a3b8;background:#fff}
  .pill.on{color:#fff;border-color:transparent}

  /* Resultados */
  .res-head{display:flex;align-items:center;gap:18px;margin-bottom:14px}
  .gauge{--p:0;--c:#94a3b8;width:92px;height:92px;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--p)*1%),#e5e7eb 0)}
  .gauge div{width:72px;height:72px;border-radius:50%;background:#fff;display:grid;place-items:center;font-weight:800;font-size:22px}
  .res-title small{display:block;color:var(--muted);font-size:13px;font-weight:500;margin-top:3px}
  .alerts{margin:0 0 12px;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
  .alerts li{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:8px;padding:8px 11px;font-size:13px}
  .alerts li.info{background:#eff6ff;border-color:#bfdbfe;color:#1e40af}
  .vars{display:flex;flex-direction:column;gap:10px}
  .var{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:#fff}
  .var-top{display:flex;align-items:center;gap:10px}
  .letter{width:30px;height:30px;border-radius:7px;color:#fff;font-weight:800;display:grid;place-items:center;flex:none}
  .var-name{font-weight:700}
  .var-score{margin-left:auto;font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}
  .bar{height:8px;background:#eef2f7;border-radius:99px;overflow:hidden;margin:9px 0 6px}
  .bar i{display:block;height:100%;border-radius:99px;transition:width .5s}
  .level{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px}
  .lv-0{background:#fee2e2;color:#991b1b}.lv-1{background:#ffedd5;color:#9a3412}.lv-2{background:#dbeafe;color:#1e40af}.lv-3{background:#dcfce7;color:#166534}
  .sub{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
  .sub span b{color:var(--ink);font-weight:600}
  .reminder{margin-top:10px;background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:10px 12px;font-size:13px}
  .reminder p{margin:0 0 6px}
  .reminder ul{margin:0;padding-left:18px}
  .empty{padding:50px 20px;text-align:center;color:var(--muted)}

  /* Historial */
  #historial{margin-top:20px}
  .table-wrap{overflow-x:auto;margin-top:12px}
  table.hist{border-collapse:collapse;width:100%;font-size:13.5px}
  table.hist th,table.hist td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
  table.hist th{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.3px}
  table.hist td:first-child,table.hist th:first-child{text-align:left}
  table.hist tr.sel{background:#f8fafc}
  .cell{display:inline-block;min-width:40px;padding:2px 6px;border-radius:6px;font-weight:700;font-variant-numeric:tabular-nums}
  .c0{background:#fee2e2;color:#991b1b}.c1{background:#ffedd5;color:#9a3412}.c2{background:#dbeafe;color:#1e40af}.c3{background:#dcfce7;color:#166534}
  .delta{font-size:11px;font-weight:700;margin-left:3px}
  .delta.up{color:var(--ok)}.delta.down{color:var(--bad)}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;z-index:50;box-shadow:var(--shadow)}
  @media (max-width:700px){header.top{position:static}}
  .lang{display:inline-flex;border:1px solid rgba(255,255,255,.35);border-radius:8px;overflow:hidden}
  .lang button{background:transparent;color:#fff;border:0;padding:6px 10px;font-size:12.5px;font-weight:700;opacity:.7}
  .lang button.on{background:#fff;color:var(--accent);opacity:1}
  .tips{margin:14px 0 0;padding-left:20px;font-size:13.5px}
  .tips li{margin:3px 0}
  .source{font-size:12px;color:var(--muted);margin-top:10px;font-style:italic}
  .right-tools{margin-left:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .student-chip{margin-left:0}
  .cita{margin:-4px 0 20px;padding:14px 20px;border-left:4px solid #fbbf24;background:#fffbeb;border-radius:0 var(--radius) var(--radius) 0}
  .cita p{margin:0;font-size:17px;font-style:italic;font-weight:600;color:#1e293b}
  .cita cite{display:block;margin-top:4px;font-size:12px;font-style:normal;color:var(--muted)}
  footer{text-align:center;font-size:12px;color:var(--muted);padding:10px 20px 30px}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <div class="logo" id="logo"></div>
      <span data-i18n="titulo"></span>
    </div>
    <div class="right-tools">
      <div class="student-chip hidden" id="chip">
        <span>👤 <b id="chipNombre"></b> · <span id="chipDni"></span></span>
        <button class="btn btn-report" id="btnInforme" data-i18n="generarInforme" data-i18n-title="generarInformeTitle"></button>
        <button class="btn btn-ghost btn-sm" id="btnSalir" data-i18n="empezarDeCero" data-i18n-title="empezarDeCeroTitle"></button>
      </div>
      <div class="lang" role="group" aria-label="Idioma / Language">
        <button data-lang="es" title="Español">ES</button>
        <button data-lang="en" title="English">EN</button>
      </div>
    </div>
  </div>
</header>

<main>
  <!-- PASO 1: identificación -->
  <section id="ident" class="card">
    <h1 data-i18n="identTitulo"></h1>
    <p class="muted" style="margin:0" data-i18n="identIntro"></p>
    <form id="formIdent" novalidate>
      <div class="row2">
        <div class="field">
          <label for="nombre" data-i18n="nombre"></label>
          <input id="nombre" autocomplete="given-name" required>
          <span class="err" id="errNombre"></span>
        </div>
        <div class="field">
          <label for="apellidos" data-i18n="apellidos"></label>
          <input id="apellidos" autocomplete="family-name" required>
          <span class="err" id="errApellidos"></span>
        </div>
      </div>
      <div class="field">
        <label for="dni" data-i18n="dni"></label>
        <input id="dni" placeholder="12345678Z" autocomplete="off" required>
        <span class="err" id="errDni"></span>
      </div>
      <div style="margin-top:18px"><button class="btn btn-primary" type="submit" data-i18n="comenzar"></button></div>
    </form>
    <div class="notice" data-i18n="privacidad"></div>
  </section>

  <!-- PASO 2: trabajo -->
  <section id="app" class="hidden">
    <details class="guide card" id="guia">
      <summary data-i18n="guiaTitulo"></summary>
      <div class="guide-grid" id="guiaGrid"></div>
      <h3 style="font-size:14.5px;margin-top:16px" data-i18n="consejosTitulo"></h3>
      <ul class="tips" id="consejos"></ul>
      <div class="source" id="fuente"></div>
    </details>

    <blockquote class="cita" lang="en">
      <p id="cita"></p>
      <cite id="citaFuente"></cite>
    </blockquote>

    <div class="grid">
      <div class="card">
        <div class="editor-head">
          <h2><span data-i18n="tuPrompt"></span> <span class="muted small" id="intentoLabel"></span></h2>
          <button class="btn btn-light btn-sm" id="btnPlantilla" data-i18n="insertarPlantilla"></button>
        </div>
        <textarea id="prompt" spellcheck="true" data-i18n-ph="placeholder"></textarea>
        <div class="detected" id="detected"></div>
        <div class="editor-foot">
          <span class="muted small" id="contador"></span>
          <button class="btn btn-primary" id="btnEvaluar" data-i18n="evaluar"></button>
        </div>
      </div>

      <div class="card" id="resultados">
        <div class="empty" id="resEmpty">
          <div style="font-size:34px">⭐</div>
          <p data-i18n-html="vacioRes"></p>
        </div>
        <div id="resBody" class="hidden"></div>
      </div>
    </div>

    <section class="card hidden" id="historial">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">
        <h2 data-i18n="historial"></h2>
        <span class="muted small" data-i18n="historialAyuda"></span>
      </div>
      <div class="table-wrap"><table class="hist" id="tablaHist"></table></div>
    </section>
  </section>
</main>

<footer id="pie"></footer>

<script src="lib/jspdf.umd.min.js"></script>
<script src="lib/jspdf.plugin.autotable.min.js"></script>
<script src="js/config.js"></script>
<script src="js/i18n.js"></script>
<script src="js/evaluador.js"></script>
<script src="js/app.js"></script>
</body>
</html>
